name: pulse
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.2
  local_auth: ^3.0.2
  flutter_tts: ^4.2.5
  flutter_riverpod: ^3.4.2
  sqflite: ^2.4.3
  path: ^1.9.1
  file_picker: 10.3.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.2

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon.png